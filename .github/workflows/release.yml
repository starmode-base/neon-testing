name: Release

# State-driven publishing: update the version in package.json when you want to
# cut a release - a push whose version is not yet on npm publishes it, from
# any branch (rules in README > Release).
on:
  push:
    branches: ["**"]

permissions:
  contents: read

# One release per branch at a time; never kill a publish in flight
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # Skip in forks - the secrets and npm publishing identity only exist in
    # this repo
    if: github.repository == 'starmode-base/neon-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      npm_tag: ${{ steps.tag.outputs.npm_tag }}
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Nothing after clone needs git auth - don't leave a token in
          # .git/config for repo code to read
          persist-credentials: false

      - name: Validate the version and derive the npm dist-tag
        # The version must be 3.1.0 or 3.1.0-beta.0 style (stricter than
        # semver: no leading zeros, lowercase tag). The dist-tag is the
        # prerelease identifier, or latest for stable. Must run before the
        # npm probe, which resolves anything non-exact as a range or dist-tag.
        id: tag
        run: |
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([a-z]+)\.(0|[1-9][0-9]*))?$ ]] ||
            { echo "Invalid version $version - use e.g. 3.1.0 or 3.1.0-beta.0 (lowercase tag)"; exit 1; }
          [[ "${BASH_REMATCH[5]}" != "latest" ]] ||
            { echo "Prerelease $version must not take the latest dist-tag"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=${BASH_REMATCH[5]:-latest}" >> "$GITHUB_OUTPUT"

      - name: Skip when the version is already on npm
        id: check
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          published="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "$NAME@$VERSION is already on npm - nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not on npm - releasing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Keep in sync with the check job in check.yml. Differs only in the job
  # guard (the gate dependency here, the fork guard there) and the PR-head
  # checkout ref, which is meaningless here.
  check:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # SECURITY: this job runs repo code (tests, dev dependencies) and must not
    # hold publish rights - never give it a write-capable GITHUB_TOKEN
    permissions:
      contents: read

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Nothing after clone needs git auth - don't leave a token in
          # .git/config for repo code to read
          persist-credentials: false

      - name: Setup Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Setup Bun
        # https://github.com/oven-sh/setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Log versions
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "Bun: $(bun -v)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        env:
          # https://github.com/starmode-base/neon-testing/settings/variables/actions
          # https://github.com/starmode-base/neon-testing/settings/secrets/actions
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: bun run check

  publish:
    needs: [gate, check]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write # Required for Trusted Publishers (OIDC) - https://docs.npmjs.com/trusted-publishers
      contents: write # Required for creating the release tag and GitHub release

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # npm publish uses OIDC and gh uses GH_TOKEN - git auth is not needed
          persist-credentials: false

      - name: Setup Node.js
        # https://github.com/actions/setup-node
        # Node 24 bundles npm >= 11.5.1, required for Trusted Publishers
        # https://docs.npmjs.com/trusted-publishers
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        # https://github.com/oven-sh/setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Log versions
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "Bun: $(bun -v)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        # Publish uses OIDC - no token needed; prepublishOnly builds dist.
        # Provenance is automatically generated
        # https://docs.npmjs.com/trusted-publishers
        # npm versions are immutable - skip instead of failing when the
        # version is already published (re-runs, concurrent runs)
        env:
          NAME: ${{ needs.gate.outputs.name }}
          VERSION: ${{ needs.gate.outputs.version }}
          NPM_TAG: ${{ needs.gate.outputs.npm_tag }}
        run: |
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
            echo "$NAME@$VERSION is already on npm - skipping publish"
          else
            npm publish --tag "$NPM_TAG"
          fi

      - name: Create the GitHub release
        # --target pins the tag to the released commit; prereleases (any
        # non-latest dist-tag) are marked so GitHub never shows one as the
        # latest release. Notes baseline on the previous stable release, not
        # on prerelease tags that may live on other branches.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          NPM_TAG: ${{ needs.gate.outputs.npm_tag }}
          TARGET: ${{ github.sha }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists - skipping"
            exit 0
          fi
          args=(--title "v$VERSION" --target "$TARGET" --generate-notes)
          prev="$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$prev" ]; then
            args+=(--notes-start-tag "$prev")
          fi
          if [ "$NPM_TAG" != "latest" ]; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" "${args[@]}"
